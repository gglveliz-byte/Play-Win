<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PlayWin SDK Test</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <h1>Juego de Prueba (Canvas de Fondo)</h1>

  <script src="./playwin-bridge.js"></script>
  <script>
    PlayWin.init({
      gameId: 'flapy-flapy',
      callbacks: {
        onMatchReady: (data) => console.log('Match Ready con semilla:', data.seed),
        onMatchLive: () => console.log('Partida LIVE!'),
        onMatchEnd: (res) => console.log('Resultado:', res)
      }
    });
  </script>
</body>
</html>
