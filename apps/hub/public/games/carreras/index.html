<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Play Win - Speed Horizon 3D 1v1</title>
  
  <!-- Tipografía Oficial Inter & Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- SDK Universal Play Win & Estilos de Juego -->
  <link rel="stylesheet" href="/game-sdk/playwin-bridge.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="c"></canvas>

    <!-- HUD de Carrera (Velocidad, Tiempo y Distancia) -->
    <div id="racing-hud" class="racing-hud-layer">
      <div class="hud-box hud-speed-box">
        <span class="hud-label">VELOCIDAD</span>
        <span id="hud-speed" class="hud-value">0 <small>KM/H</small></span>
      </div>
      <div class="hud-box hud-time-box">
        <span class="hud-label">TIEMPO</span>
        <span id="hud-time" class="hud-value">20</span>
      </div>
      <div class="hud-box hud-dist-box">
        <span class="hud-label">DISTANCIA</span>
        <span id="hud-dist" class="hud-value">0 <small>M</small></span>
      </div>
    </div>

    <!-- Botón Flotante TURBO en esquina superior para Móvil -->
    <button id="btn-touch-nitro" class="mobile-corner-nitro" title="Turbo Nitro">
      <span>⚡</span> NITRO
    </button>

    <!-- Controles Táctiles Inferiores para Móviles / Tablets -->
    <div id="touch-controls" class="mobile-controls-layer">
      <div class="steer-left-zone">
        <button id="btn-touch-left" class="touch-btn steer-btn">◀</button>
      </div>

      <div class="steer-right-zone">
        <button id="btn-touch-brake" class="touch-btn brake-btn">🛑 FRENO</button>
        <button id="btn-touch-right" class="touch-btn steer-btn">▶</button>
      </div>
    </div>
  </div>

  <!-- Inyección del SDK Universal y Script del Juego -->
  <script src="/game-sdk/playwin-bridge-ui.js"></script>
  <script src="/game-sdk/playwin-bridge-status.js"></script>
  <script src="/game-sdk/playwin-bridge-connection.js"></script>
  <script src="/game-sdk/playwin-bridge.js"></script>
  <script src="script.js"></script>
</body>
</html>
